name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Dockerfile.production'
      - 'Dockerfile'
      - '.dockerignore'
      - '.streamlit/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: 'rag-apps-482206'
  REGION: 'europe-west12'
  SERVICE_NAME: 'crr-rag-app'
  REPOSITORY: 'my-python-repo'
  IMAGE_NAME: 'crr-rag-app'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set default GCP project
        run: gcloud config set project ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.production \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - id: deploy
        name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8501 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --cpu-boost \
            --set-env-vars "OPENAI_EMBEDD_KEY=${{ secrets.OPENAI_EMBEDD_KEY }},OPENAI_CHAT_KEY=${{ secrets.OPENAI_CHAT_KEY }},ASTRA_DB_TOKEN=${{ secrets.ASTRA_DB_TOKEN }},ASTRA_DB_API_ENDPOINT=${{ secrets.ASTRA_DB_API_ENDPOINT }},ASTRA_DB_COLLECTION_NAME=${{ secrets.ASTRA_DB_COLLECTION_NAME }}" \
            --quiet

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          for i in $(seq 1 6); do
            if curl -sf "$SERVICE_URL/_stcore/health" > /dev/null 2>&1; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Retry $i/6..."
            sleep 10
          done
          echo "❌ Health check failed after 6 retries"
          exit 1

      - name: Rollback on verify failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(name)' \
            --sort-by '~metadata.creationTimestamp' \
            --limit 2 | tail -1)
          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "🔄 Rolling back to: $PREVIOUS_REVISION"
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --to-revisions=$PREVIOUS_REVISION=100 \
              --region ${{ env.REGION }} \
              --project ${{ env.PROJECT_ID }}
          else
            echo "⚠️ No previous revision to roll back to"
          fi
