name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      # Application code
      - '**.py'
      # Dependencies
      - 'requirements.txt'
      - 'pyproject.toml'
      # Production Docker configuration
      - 'Dockerfile.production'
      # Streamlit configuration
      - '.streamlit/**'
      # GitHub Actions workflow itself
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

env:
  PROJECT_ID: 'rag-apps-482206'
  REGION: 'europe-west12'
  SERVICE_NAME: 'crr-rag-app'
  REPOSITORY: 'my-python-repo'
  IMAGE_NAME: 'crr-rag-app'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set default GCP project
        run: gcloud config set project ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.production \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push --all-tags ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}

      - name: Write env vars file
        run: |
          cat > /tmp/env-vars.yaml <<EOF
          OPENAI_EMBEDD_KEY: "${{ secrets.OPENAI_EMBEDD_KEY }}"
          OPENAI_CHAT_KEY: "${{ secrets.OPENAI_CHAT_KEY }}"
          ASTRA_DB_TOKEN: "${{ secrets.ASTRA_DB_TOKEN }}"
          ASTRA_DB_API_ENDPOINT: "${{ secrets.ASTRA_DB_API_ENDPOINT }}"
          ASTRA_DB_COLLECTION_NAME: "${{ secrets.ASTRA_DB_COLLECTION_NAME }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8501 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --cpu-boost \
            --env-vars-file /tmp/env-vars.yaml \
            --quiet

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          curl -sf "$SERVICE_URL/_stcore/health"
