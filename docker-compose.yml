services:
  crr-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crr-rag-app
    ports:
      - "8501:8501"
    environment:
      - OPENAI_CHAT_KEY=${OPENAI_CHAT_KEY}
      - OPENAI_EMBEDD_KEY=${OPENAI_EMBEDD_KEY}
      - ASTRA_DB_TOKEN=${ASTRA_DB_TOKEN}
      - ASTRA_DB_API_ENDPOINT=${ASTRA_DB_API_ENDPOINT}
      - ASTRA_DB_COLLECTION_NAME=${ASTRA_DB_COLLECTION_NAME}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - crr-network

networks:
  crr-network:
    driver: bridge
